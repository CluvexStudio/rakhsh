<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#121212" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>rakhsh Control Center</title>
    <script>
      // Settle the theme before first paint, so a reload does not flash the other one.
      try {
        var t = localStorage.getItem("rakhsh-theme") || "dark"
        document.documentElement.classList.toggle("dark", t === "dark")
        document.documentElement.style.colorScheme = t
        document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#121212" : "#e7e2d6"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
