name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ZIG_VERSION: 0.17.1

jobs:
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # uname -m values are mapped onto these triples by gh_arch() in install.sh.
          - { arch: x86_64, target: x86_64-unknown-linux-musl, required: true }
          - { arch: aarch64, target: aarch64-unknown-linux-musl, required: true }
          - { arch: armv7, target: armv7-unknown-linux-musleabihf, required: true }
          - { arch: i686, target: i686-unknown-linux-musl, required: true }
          # mimalloc is a C library; the rest take the Rust allocator rather
          # than carry its build on architectures with no test hardware.
          - { arch: armv6, target: arm-unknown-linux-musleabi, required: true, flags: --no-default-features }
          - { arch: riscv64, target: riscv64gc-unknown-linux-musl, required: true, flags: --no-default-features }
          # These two are the only ones allowed to fail without stopping a
          # release: niche enough that a toolchain regression there should not
          # hold back everyone else's binaries.
          - { arch: loongarch64, target: loongarch64-unknown-linux-musl, required: false, flags: --no-default-features }
          - { arch: ppc64le, target: powerpc64le-unknown-linux-musl, required: false, flags: --no-default-features }
    steps:
      - uses: actions/checkout@v5
        with:
          path: rakhsh

      # rakhsh depends on shabdiz by path (../shabdiz), so both trees have to be
      # side by side. While shabdiz is private, github.token cannot read it:
      # supply either a read-only deploy key in secrets.SHABDIZ_SSH_KEY or a PAT
      # in secrets.SHABDIZ_TOKEN. Once shabdiz is public, neither is needed.
      - uses: actions/checkout@v5
        with:
          repository: CluvexStudio/shabdiz
          path: shabdiz
          ssh-key: ${{ secrets.SHABDIZ_SSH_KEY }}
          token: ${{ secrets.SHABDIZ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rakhsh
          key: ${{ matrix.target }}

      - name: Build
        working-directory: rakhsh
        run: |
          cargo zigbuild --release --target ${{ matrix.target }} -p rakhsh ${{ matrix.flags }}
          cargo zigbuild --release --target ${{ matrix.target }} -p rakhsh-control

      - name: Name the assets and check them over
        working-directory: rakhsh
        run: |
          set -eu
          mkdir -p dist
          for bin in rakhsh rakhsh-control; do
            src="target/${{ matrix.target }}/release/$bin"
            out="dist/$bin-${{ matrix.target }}"
            install -m755 "$src" "$out"
            ( cd dist && sha256sum "$bin-${{ matrix.target }}" > "$bin-${{ matrix.target }}.sha256" )
            file "$out"
            printf '%s  %s\n' "$(du -h "$out" | cut -f1)" "$out"
          done
          # A dynamic executable here means the musl target silently linked
          # against the runner's glibc and would not start on a bare server.
          for out in dist/rakhsh-* ; do
            case "$out" in *.sha256) continue;; esac
            if file "$out" | grep -q "dynamically linked"; then
              echo "::error::$out is dynamically linked; it must be static"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: rakhsh/dist/*
          if-no-files-found: error

  # Windows and macOS get every carrier except the Linux-only raw ones. On
  # Windows faketcp loads Npcap or WinDivert at run time, and the windivert zip
  # puts the official signed WinDivert files next to the same rakhsh.exe.
  desktop:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc, wd: x64 }
          - { os: windows, arch: i686, runner: windows-latest, target: i686-pc-windows-msvc, wd: x86 }
          - { os: windows, arch: aarch64, runner: windows-latest, target: aarch64-pc-windows-msvc }
          # GitHub's arm64 macOS pool often has no free runner; the Intel one
          # builds both targets, since Xcode targets Apple Silicon from either.
          - { os: macos, arch: x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos, arch: aarch64, runner: macos-15-intel, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v5
        with:
          path: rakhsh

      - uses: actions/checkout@v5
        with:
          repository: CluvexStudio/shabdiz
          path: shabdiz
          ssh-key: ${{ secrets.SHABDIZ_SSH_KEY }}
          token: ${{ secrets.SHABDIZ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring and aws-lc compile their ARM64 Windows code with clang, which
      # comes from the runner's LLVM.
      - name: Put clang on the path
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rakhsh
          key: ${{ matrix.target }}

      - name: Build
        working-directory: rakhsh
        run: cargo build --release --target ${{ matrix.target }} -p rakhsh -p rakhsh-control

      - name: Name the assets
        working-directory: rakhsh
        shell: bash
        run: |
          set -eu
          case "${{ matrix.os }}" in windows) ext=".exe" ;; *) ext="" ;; esac
          mkdir -p dist
          for bin in rakhsh rakhsh-control; do
            name="$bin-${{ matrix.target }}$ext"
            cp "target/${{ matrix.target }}/release/$bin$ext" "dist/$name"
            if command -v sha256sum >/dev/null; then sum=$(sha256sum "dist/$name"); else sum=$(shasum -a 256 "dist/$name"); fi
            printf '%s  %s\n' "${sum%% *}" "$name" > "dist/$name.sha256"
            ls -l "dist/$name"
          done

      - name: Fetch WinDivert
        if: matrix.wd
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'windivert.zip'
          $out = Join-Path $env:RUNNER_TEMP 'windivert'
          Invoke-WebRequest -Uri "https://github.com/basil00/WinDivert/releases/download/v$env:WINDIVERT_VERSION/WinDivert-$env:WINDIVERT_VERSION-A.zip" -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne $env:WINDIVERT_SHA256) { throw "WinDivert zip is $sum, expected $env:WINDIVERT_SHA256" }
          Expand-Archive $zip -DestinationPath $out
          $dll = Get-ChildItem $out -Recurse -Filter WinDivert.dll | Where-Object { $_.Directory.Name -eq '${{ matrix.wd }}' } | Select-Object -First 1
          if (-not $dll) { throw 'no WinDivert.dll for ${{ matrix.wd }} in the release' }
          foreach ($f in Get-ChildItem $dll.Directory.FullName -Filter *.sys) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -in 'NotSigned', 'HashMismatch') { throw "$($f.Name) failed its signature check" }
          }
          "WINDIVERT_DIR=$($dll.Directory.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "WINDIVERT_ROOT=$($dll.Directory.Parent.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        env:
          WINDIVERT_VERSION: 2.2.2
          WINDIVERT_SHA256: 63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15

      - name: Package with WinDivert
        if: matrix.wd
        working-directory: rakhsh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'target\${{ matrix.target }}\release\rakhsh.exe'
          & $exe --help > $null
          if ($LASTEXITCODE -ne 0) { throw "rakhsh.exe exited with $LASTEXITCODE" }
          $name = 'rakhsh-windivert-${{ matrix.target }}'
          $pkg = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item $exe $pkg
          Copy-Item (Join-Path $env:WINDIVERT_DIR 'WinDivert.dll'), (Join-Path $env:WINDIVERT_DIR 'WinDivert*.sys') $pkg
          $license = Get-ChildItem $env:WINDIVERT_ROOT -Filter 'LICENSE*' | Select-Object -First 1
          if (-not $license) { throw 'no LICENSE in the WinDivert release' }
          Copy-Item $license.FullName (Join-Path $pkg 'WinDivert-LICENSE.txt')
          Get-ChildItem $pkg
          Compress-Archive -Path $pkg -DestinationPath "dist\$name.zip"
          $sum = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) "$name.zip.sha256"), "$sum  $name.zip`n")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: rakhsh/dist/*
          if-no-files-found: error

  publish:
    needs: [linux, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect the checksums
        run: |
          set -eu
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      # gh ships on the runner, so nothing third-party touches the step that
      # publishes the binaries people download.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
