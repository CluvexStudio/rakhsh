name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
# RUSTFLAGS is deliberately not set here: -D warnings in the environment
# applies to dependencies as well, so one upstream crate's warning would fail
# the build. Clippy gets the flag on its own command line instead.

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: rakhsh

      - uses: actions/checkout@v5
        with:
          repository: CluvexStudio/shabdiz
          path: shabdiz
          ssh-key: ${{ secrets.SHABDIZ_SSH_KEY }}
          token: ${{ secrets.SHABDIZ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rakhsh

      # Scoped to this repo's packages: --all reaches into the shabdiz path
      # dependency, which has its own CI.
      - name: Formatting
        working-directory: rakhsh
        run: cargo fmt --check -p rakhsh -p rakhsh-control

      - name: Clippy
        working-directory: rakhsh
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: rakhsh
        run: cargo test --workspace

      # The allocator is behind a feature so the odd release targets can drop
      # it; this proves the build without it still compiles.
      - name: Build without mimalloc
        working-directory: rakhsh
        run: cargo check -p rakhsh --no-default-features

  # The raw-packet carriers (faketcp, l2tcp, icmp, spoof, and the shabdiz raw
  # carriers) are Linux-only; the stream carriers, the router and the control
  # centre build on Windows and macOS. These native runners prove the client
  # still compiles and tests there with the raw carriers gated out. They need
  # the shabdiz checkout, so they wait on the same SHABDIZ_SSH_KEY as the rust
  # job while shabdiz is private.
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: rakhsh

      - uses: actions/checkout@v5
        with:
          repository: CluvexStudio/shabdiz
          path: shabdiz
          ssh-key: ${{ secrets.SHABDIZ_SSH_KEY }}
          token: ${{ secrets.SHABDIZ_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rakhsh
          key: ${{ matrix.os }}

      - name: Build
        working-directory: rakhsh
        run: cargo build -p rakhsh

      - name: Tests
        working-directory: rakhsh
        run: cargo test --workspace

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/panel-ui/package-lock.json

      - name: Install
        working-directory: control/panel-ui
        run: npm ci

      - name: Types
        working-directory: control/panel-ui
        run: npx tsc --noEmit

      - name: Build
        working-directory: control/panel-ui
        run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck the installer
        run: shellcheck --severity=warning install.sh

      - name: install.sh --help works without root
        run: bash install.sh --help
